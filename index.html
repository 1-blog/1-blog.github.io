<!DOCTYPE html>
<html>
<head>
  <script>
    async function redirect() {
      const urls = [
        "https://balibabu.duckdns.org",
        "https://seriously-direct-unicorn.ngrok-free.app"
      ];

      for (const url of urls) {
        try {
          await fetch(url, { mode: "no-cors" });
          window.location.href = url;
          return;
        } catch (e) {}
      }

      document.body.innerText = "All servers unreachable.";
    }

    redirect();
  </script>
</head>
<body></body>
</html>
