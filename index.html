<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repositories</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --badge-green-bg: rgba(46, 160, 67, 0.15);
      --badge-green-text: #3fb950;
      --badge-green-border: rgba(46, 160, 67, 0.4);
      --badge-gray-bg: rgba(110, 118, 129, 0.15);
      --badge-gray-text: #8b949e;
      --badge-gray-border: rgba(110, 118, 129, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 32px auto;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .repo-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Staggered entrance animation (removed after it finishes so hover still works) */
    .card-enter {
      opacity: 0;
      transform: translateY(14px);
      animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-blue);
      word-break: break-word;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge.published {
      background-color: var(--badge-green-bg);
      color: var(--badge-green-text);
      border: 1px solid var(--badge-green-border);
    }

    .badge.source {
      background-color: var(--badge-gray-bg);
      color: var(--badge-gray-text);
      border: 1px solid var(--badge-gray-border);
    }

    .description {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.45;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      background-color: var(--accent-blue);
      margin-right: 4px;
    }

    /* --- Loading / empty / error states --- */
    .loader {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      font-size: 1.1rem;
      padding: 40px;
    }

    /* Lively top status bar shown while loading */
    .loader-status {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--card-border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-status .caret {
      display: inline-block;
      width: 8px;
      color: var(--accent-blue);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* Shimmering skeleton placeholder cards */
    .skeleton-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: skeletonFade 0.4s ease both;
    }

    @keyframes skeletonFade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .skeleton-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background-color: #21262d;
      border-radius: 6px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.07),
        transparent
      );
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .sk-title { height: 18px; width: 55%; }
    .sk-badge { height: 16px; width: 72px; }
    .sk-desc  { height: 13px; width: 100%; }
    .sk-desc.short { width: 70%; }
    .sk-foot  { height: 13px; width: 45%; }
  </style>
</head>
<body>

  <main id="repo-grid" class="repo-grid">
    <!-- The lively skeleton loader + status text are injected by initShowcase() -->
  </main>

  <script>
    // 1. DYNAMIC USERNAME DETECTION
    function getUsername() {
      // Allow override via URL query parameter (e.g. ?user=octocat)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('user')) {
        return urlParams.get('user');
      }

      // Automatically extract username if hosted on "username.github.io"
      const hostname = window.location.hostname;
      if (hostname.endsWith('.github.io')) {
        return hostname.split('.')[0];
      }

      // Fallback username for local development (localhost)
      return 'keshav';
    }

    // 2. TARGET LINK DETERMINATION
    function getTargetUrl(repo, username) {
      // repo.has_pages indicates if GitHub Pages is active for this repository
      if (repo.has_pages) {
        // Root profile repository site
        if (repo.name.toLowerCase() === `${username.toLowerCase()}.github.io`) {
          return `https://${username}.github.io/`;
        }
        // Sub-path published page
        return `https://${username}.github.io/${repo.name}/`;
      }

      // Not published -> fallback to source code repository on GitHub
      return repo.html_url;
    }

    // 3. LOADING UI HELPERS
    const STATUS_MESSAGES = [
      'Waking up the servers',
      'Talking to GitHub',
      'Gathering repositories',
      'Sorting your projects',
      'Adding a little polish',
      'Almost there'
    ];

    // Renders shimmering skeleton placeholder cards + a cycling status line.
    function renderLoader(grid, count = 6) {
      grid.innerHTML = '';

      const status = document.createElement('div');
      status.className = 'loader-status';
      status.innerHTML =
        '<span class="spinner"></span>' +
        '<span id="status-text">Loading<span class="caret">_</span></span>';
      grid.appendChild(status);

      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'skeleton-card';
        card.innerHTML =
          '<div class="skeleton-row">' +
            '<div class="skeleton sk-title"></div>' +
            '<div class="skeleton sk-badge"></div>' +
          '</div>' +
          '<div class="skeleton sk-desc"></div>' +
          '<div class="skeleton sk-desc short"></div>' +
          '<div style="flex-grow:1;"></div>' +
          '<div class="skeleton sk-foot"></div>';
        grid.appendChild(card);
      }

      return status;
    }

    // Cycles through friendly status messages until the returned stop() is called.
    function startStatusCycle(statusEl) {
      const textEl = statusEl.querySelector('#status-text');
      let i = 0;
      const setMsg = () => {
        textEl.innerHTML =
          STATUS_MESSAGES[i % STATUS_MESSAGES.length] +
          '<span class="caret">_</span>';
        i++;
      };
      setMsg();
      const intervalId = setInterval(setMsg, 850);
      return () => clearInterval(intervalId);
    }

    // Extracts the display-order number from a leading "#N" in the description.
    // Returns null when the description has no such marker.
    function getDisplayOrder(repo) {
      const match = (repo.description || '').match(/^\s*#(\d+)/);
      return match ? parseInt(match[1], 10) : null;
    }

    // 4. FETCH, SORT AND RENDER REPOSITORIES
    async function initShowcase() {
      const username = getUsername();
      const grid = document.getElementById('repo-grid');

      const statusEl = renderLoader(grid, 6);
      const stopStatus = startStatusCycle(statusEl);

      try {
        const response = await fetch(
          `https://api.github.com/users/${username}/repos?sort=updated&per_page=100`
        );

        if (!response.ok) {
          throw new Error(`Failed to fetch repositories (HTTP ${response.status})`);
        }

        const repos = await response.json();

        // Sort: repos whose description starts with "#N" come first in ascending
        // numeric order. Repos without a marker keep their default (latest-first)
        // order and appear after all numbered ones.
        const ordered = repos
          .map((repo, idx) => ({ repo, idx }))
          .sort((a, b) => {
            const an = getDisplayOrder(a.repo);
            const bn = getDisplayOrder(b.repo);
            if (an !== null && bn !== null) return an - bn;
            if (an !== null) return -1;
            if (bn !== null) return 1;
            return a.idx - b.idx; // neither numbered -> keep original order
          });

        stopStatus();
        grid.innerHTML = ''; // Clear loading screen

        if (repos.length === 0) {
          grid.innerHTML = '<div class="loader">No public repositories found.</div>';
          return;
        }

        ordered.forEach(({ repo }, i) => {
          // Skip forked repositories
          if (repo.fork) return;

          const isPublished = repo.has_pages;
          const targetUrl = getTargetUrl(repo, username);

          const card = document.createElement('a');
          card.className = 'card card-enter';
          card.style.animationDelay = `${i * 0.05}s`;
          // Remove the entrance class once it finishes so the hover lift works.
          card.addEventListener('animationend', function handler(e) {
            if (e.target !== card) return;
            card.classList.remove('card-enter');
            card.style.animationDelay = '';
            card.removeEventListener('animationend', handler);
          });
          card.href = targetUrl;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          card.innerHTML = `
            <div>
              <div class="card-header">
                <span class="card-title">${repo.name}</span>
                <span class="badge ${isPublished ? 'published' : 'source'}">
                  ${isPublished ? 'Live Site' : 'GitHub'}
                </span>
              </div>
              <p class="description">
                ${repo.description || 'No description provided.'}
              </p>
            </div>
            <div class="card-footer">
              ${repo.language ? `<span><span class="lang-dot"></span>${repo.language}</span>` : ''}
              <span>⭐ ${repo.stargazers_count}</span>
              <span>🍴 ${repo.forks_count}</span>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (error) {
        stopStatus();
        grid.innerHTML = `<div class="loader" style="color: #f85149;">Error: ${error.message}</div>`;
      }
    }

    initShowcase();
  </script>
</body>
</html>
